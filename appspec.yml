version: 0.0
os: linux
files:
  - source: /FrontController.php
    destination: /var/www/html/split2ship/app/Controllers/
hooks:
  BeforeInstall:
    - location: scripts/install_dependencies
      timeout: 300
      runas: root
    - location: scripts/start_server
      timeout: 300
      runas: root
  ApplicationStop:
    - location: scripts/stop_server
      timeout: 300
      runas: root

